name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            name: schema-watch-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            ext: ""
            name: schema-watch-macos-amd64
          - goos: darwin
            goarch: arm64
            ext: ""
            name: schema-watch-macos-arm64
          - goos: linux
            goarch: amd64
            ext: ""
            name: schema-watch-linux-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o ${{ matrix.name }} .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
