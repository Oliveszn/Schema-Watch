# Every field here is optional — CLI flags (--target, --port) override
# whatever is set here, and built-in defaults apply if both are absent.

target: "http://localhost:8080" # backend to proxy requests to
port: "9090"

# Field names to ignore during diffing
ignore_fields:
  - updated_at
  - created_at

# Endpoints to skip diffing entirely
ignore_endpoints:
  - "GET /health"
  - "GET /metrics*"
  - GET /favicon.ico
